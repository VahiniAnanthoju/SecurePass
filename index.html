
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass - Password Security Analyzer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f1f5f9;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #1e293b;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px #0005;
        }
        h1 { text-align: center; margin-top: 0; }
        .subtitle { text-align: center; color: #94a3b8; }
        label { display: block; margin: 20px 0 8px; }
        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .primary { width: 100%; margin-top: 12px; background: #38bdf8; color: #082f49; }
        .secondary { background: #334155; color: white; }
        .result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 10px; }
        .bar { height: 8px; background: #334155; border-radius: 5px; margin: 12px 0; overflow: hidden; }
        #strengthBar { height: 100%; width: 0; transition: width .2s; }
        li { margin: 9px 0; color: #cbd5e1; }
        .generator { margin-top: 25px; border-top: 1px solid #475569; padding-top: 15px; }
        .output { overflow-wrap: anywhere; margin: 12px 0; color: #7dd3fc; }
        .note { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    </style>
</head>
<body>
    <main class="container">
        <h1>🔐 SecurePass</h1>
        <p class="subtitle">Password Security Analyzer</p>

        <label for="password">Enter a password to analyze</label>
        <input id="password" type="password" placeholder="Enter a test password" autocomplete="off">
        <button class="primary" id="analyze">Analyze Password</button>

        <section class="result" aria-live="polite">
            <strong>Strength: <span id="strength">Not checked</span></strong>
            <div class="bar"><div id="strengthBar"></div></div>
            <ul id="suggestions">
                <li>Enter a password to see security suggestions.</li>
            </ul>
        </section>

        <section class="generator">
            <h3>Generate a Strong Password</h3>
            <button class="primary" id="generate">Generate Password</button>
            <p class="output" id="generated"></p>
            <button class="secondary" id="copy">Copy Generated Password</button>
        </section>

        <p class="note">Demo project: password checks run in your browser. Never enter a real or reused password into a demo application.</p>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const strengthText = document.getElementById("strength");
        const strengthBar = document.getElementById("strengthBar");
        const suggestions = document.getElementById("suggestions");
        const generated = document.getElementById("generated");

        function analyzePassword() {
            const password = passwordInput.value;
            let score = 0;
            const tips = [];

            if (password.length >= 12) score++;
            else tips.push("Use at least 12 characters.");

            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            else tips.push("Include both uppercase and lowercase letters.");

            if (/[0-9]/.test(password)) score++;
            else tips.push("Include a number.");

            if (/[^A-Za-z0-9]/.test(password)) score++;
            else tips.push("Consider including a special character.");

            if (password.length < 8) score = 0;

            let strength = "Weak";
            if (password.length >= 8 && score >= 3) strength = "Medium";
            if (password.length >= 12 && score === 4) strength = "Strong";
            if (!password) strength = "Not checked";

            strengthText.textContent = strength;
            strengthBar.style.width = !password ? "0%" :
                strength === "Weak" ? "25%" :
                strength === "Medium" ? "60%" : "100%";
            strengthBar.style.background =
                strength === "Weak" ? "#f87171" :
                strength === "Medium" ? "#fbbf24" : "#4ade80";

            suggestions.replaceChildren();
            if (!password) tips.push("Enter a test password to begin.");
            if (password && tips.length === 0) tips.push("Good! This password meets the demo checks.");
            tips.forEach(tip => {
                const li = document.createElement("li");
                li.textContent = tip;
                suggestions.appendChild(li);
            });
        }

        function generatePassword() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?";
            const random = new Uint32Array(16);
            crypto.getRandomValues(random);
            generated.textContent = Array.from(random, n => chars[n % chars.length]).join("");
        }

        document.getElementById("analyze").addEventListener("click", analyzePassword);
        document.getElementById("generate").addEventListener("click", generatePassword);
        document.getElementById("copy").addEventListener("click", async () => {
            if (!generated.textContent) {
                alert("Generate a password first.");
                return;
            }
            try {
                await navigator.clipboard.writeText(generated.textContent);
                alert("Generated password copied!");
            } catch {
                alert("Clipboard access unavailable. Select and copy the generated text manually.");
            }
        });
    </script>
</body>
</html>
